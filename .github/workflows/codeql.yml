name: CodeQL

# Análisis estático de seguridad. Reporta a la pestaña Security del repo;
# NO bloquea el merge (decisión consciente: empezar sin frenar el trabajo).
# Gratis en repos públicos.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Lunes 03:17 UTC — reanaliza aunque no haya cambios, para atrapar
    # vulnerabilidades nuevas descubiertas en código viejo.
    - cron: "17 3 * * 1"

jobs:
  analyze:
    name: Analizar ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
