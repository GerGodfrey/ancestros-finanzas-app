# Config de gitleaks para el escaneo de secretos en CI.
# Parte de las reglas por defecto y solo agrega una excepción acotada.
[extend]
useDefault = true

[[allowlists]]
description = "ENCRYPTION_KEY dummy de tests, commiteado a propósito para que la suite corra sin credenciales reales"
# Se excluye POR RUTA, no por valor: si esa misma cadena apareciera en
# cualquier otro archivo, gitleaks sí debe alertar.
paths = [
  '''^vitest\.setup\.ts$''',
  '''^playwright\.config\.ts$''',
]
